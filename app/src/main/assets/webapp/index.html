<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kodelab Editor</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>
  <div id="root">
    <div id="fallback" class="pane" hidden>
      <div class="hint">The editor couldn't load. Please reinstall or update Kodelab.</div>
    </div>
    <div id="monaco" class="pane" hidden></div>
    <!-- Selection affordance: a single button that appears when you highlight
         text, and only expands into a menu when tapped — so a selection never
         covers itself with a menu you didn't ask for. A long press opens the
         menu directly, which is how Paste is reached with nothing selected.
         Items that need a selection are hidden when there isn't one. -->
    <button id="sel-chip" type="button" hidden>Actions</button>
    <div id="sel-menu" hidden>
      <button type="button" data-act="findReferences" data-needs="selection">Find references</button>
      <button type="button" data-act="goToDefinition" data-needs="selection">Go to definition</button>
      <button type="button" data-act="copy" data-needs="selection">Copy</button>
      <button type="button" data-act="cut" data-needs="selection edit">Cut</button>
      <button type="button" data-act="paste" data-needs="edit">Paste</button>
      <button type="button" data-act="selectAll">Select all</button>
      <button type="button" data-act="dismiss" class="dismiss">Dismiss</button>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
